<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - TerraViva</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="registro.css">
</head>
<body>

    <div class="login-container">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
                <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
            </svg>
            TerraViva
        </div>
        <p class="subtitle">Crie sua conta e organize sua produção</p>
        
        <form id="formRegistro">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required placeholder="Ex: João da Silva">
            </div>

            <div class="form-group">
                <label for="propriedade">Nome da Propriedade</label>
                <input type="text" id="propriedade" placeholder="Ex: Fazenda Esperança (Opcional)">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>
            
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Crie uma senha forte">
            </div>
            
            <button type="submit" class="btn-login">Finalizar Cadastro</button>
        </form>

        <div class="footer-links">
            <span style="color: var(--text-muted);">Já possui conta?</span> <a href="login.html">Faça Login</a>
        </div>
    </div>

    <script>
        document.getElementById('formRegistro').addEventListener('submit', function(event) {
            event.preventDefault();

            const dadosUsuario = {
                nome: document.getElementById('nome').value,
                nomePropriedade: document.getElementById('propriedade').value,
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value
            };

            fetch('http://localhost:8080/api/auth/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dadosUsuario)
            })
            .then(async response => {
                const data = await response.json();
                if (response.ok) {
                    alert(data.mensagem);
                    window.location.href = 'login.html';
                } else {
                    throw new Error(data.erro || 'Erro ao realizar o cadastro.');
                }
            })
            .catch(error => {
                alert(error.message);
                console.error('Erro:', error);
            });
        });
    </script>

</body>
</html>
